name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install CJK fonts
        # CI runner（ubuntu-latest）默认无 CJK 字体，charts 字体回退链测试需命中
        # fonts-noto-cjk；与 Dockerfile 中运行时容器的字体安装保持一致
        run: sudo apt-get update && sudo apt-get install -y fonts-noto-cjk

      - uses: astral-sh/setup-uv@v5

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --group dev

      - name: Ruff check
        run: uv run ruff check src/ tests/

      - name: Ruff format check
        run: uv run ruff format --check src/ tests/

      - name: MyPy
        run: uv run mypy src/ || true  # third-party stub issues (docx, pptx, langgraph)

      - name: Unit tests
        run: uv run pytest tests/ --ignore=tests/e2e --ignore=tests/scripts -m "not live" -x -q

  e2e:
    runs-on: ubuntu-latest
    # 手动触发的完整 E2E（真后端+真前端+真 LLM），日常 E2E 门禁走 e2e-playwright.yml stub job
    if: github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5

      - name: Set up Python
        run: uv python install 3.12

      - name: Install backend dependencies
        run: uv sync --group dev

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend

      - name: Install Playwright browsers
        run: uv run playwright install chromium --with-deps

      - name: Start FastAPI backend
        run: uv run uvicorn finance_agent.api:app --host 127.0.0.1 --port 8000 &
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}

      - name: Start Vite frontend
        run: npm run dev -- --host 127.0.0.1 --port 5173 --strictPort &
        working-directory: frontend

      - name: Wait for services ready
        run: |
          for i in $(seq 1 60); do
            curl -sf http://127.0.0.1:8000/api/health > /dev/null 2>&1 && \
            curl -sf http://127.0.0.1:5173 > /dev/null 2>&1 && break
            sleep 2
          done
          curl -sf http://127.0.0.1:8000/api/health > /dev/null || (echo "backend not ready" && exit 1)

      - name: E2E tests
        run: uv run pytest tests/e2e/ -m "not live" -x -q
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
