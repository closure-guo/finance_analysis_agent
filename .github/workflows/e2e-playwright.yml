name: E2E Playwright

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # 每天 UTC 18:00（北京时间次日 02:00）--触发 @live nightly
    - cron: '0 18 * * *'
  workflow_dispatch:

jobs:
  # stub 套件：PR/push 触发，确定性，秒级-分钟级
  stub:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    # stub suite ~1.5 分钟；timeline suite 拉起 6 个 webServer（3 端口对）+
    # STUB_NODE_DELAY=1.5s 的 5 层管线，实际运行 ~12 分钟，预留余量放宽到 25 分钟
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5

      - name: Set up Python
        run: uv python install 3.12

      - name: Install backend dependencies
        run: uv sync --group dev

      - name: Install CJK fonts (matplotlib charts)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq fonts-noto-cjk
          # 清除 matplotlib 字体缓存，使新安装的字体生效
          rm -rf ~/.cache/matplotlib /home/runner/.cache/matplotlib

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            tests/e2e/playwright/package-lock.json
            frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend

      - name: Install Playwright dependencies
        run: |
          npm ci
          npx playwright install chromium --with-deps
        working-directory: tests/e2e/playwright

      # Playwright webServer 自动拉起前后端（TESTING=1）
      - name: Run Playwright E2E (stub suite)
        run: npx playwright test
        working-directory: tests/e2e/playwright
        env:
          CI: "true"

      # 时间序列 E2E（专属 config，STUB_SCENARIO=tool_call/pipeline，独立端口对）
      - name: Run Playwright E2E (timeline suite)
        run: npx playwright test --config=playwright.timeline.config.ts
        working-directory: tests/e2e/playwright
        env:
          CI: "true"

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: tests/e2e/playwright/playwright-report/
          retention-days: 7

  # @live 套件：nightly 触发，真 LLM，防 stub 漂移
  live:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5

      - name: Set up Python
        run: uv python install 3.12

      - name: Install backend dependencies
        run: uv sync --group dev

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend

      - name: Install Playwright browsers
        run: uv run playwright install chromium --with-deps

      - name: Run @live E2E tests
        run: uv run pytest -m live -x -q
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          LLM_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
