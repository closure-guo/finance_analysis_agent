<!-- ===== Project Shell: Shared Sidebar ===== -->
<!-- This fragment is included in every page's <main> as the left sidebar. -->
<!-- Leaf pages set data-active="true" on the matching data-nav-key element. -->
<!-- Active nav style: background: var(--bg-overlay-l2); color: var(--text-default); -->
<!-- Inactive nav style: background: transparent; color: var(--text-secondary); -->

<aside class="w-[240px] shrink-0 flex flex-col" style="background: var(--bg-base-secondary); border-right: 1px solid var(--border-neutral-l1);">
  <!-- Logo / Brand -->
  <div class="flex items-center gap-2.5 px-5 h-[56px]" style="border-bottom: 1px solid var(--border-neutral-l1);">
    <div class="w-8 h-8 flex items-center justify-center" style="background: var(--bg-brand); border-radius: var(--radius-8);">
      <i data-lucide="trending-up" class="w-4 h-4" style="color: var(--text-onbrand);"></i>
    </div>
    <span class="text-sm font-semibold" style="color: var(--text-default); font-family: var(--font-family-heading);">金融分析助手</span>
  </div>

  <!-- Navigation -->
  <nav class="flex-1 px-3 py-4 flex flex-col gap-1">
    <div data-nav-key="home" data-active="false" class="flex items-center gap-2.5 px-3 h-8 text-sm cursor-pointer" style="background: transparent; color: var(--text-secondary); border-radius: var(--radius-8); font-size: var(--body-base-font-size); line-height: var(--body-base-line-height);">
      <i data-lucide="plus-square" class="w-4 h-4" style="color: var(--icon-tertiary);"></i>
      <span>新建分析</span>
    </div>
    <div data-nav-key="history" data-active="false" class="flex items-center gap-2.5 px-3 h-8 text-sm cursor-pointer" style="background: transparent; color: var(--text-secondary); border-radius: var(--radius-8); font-size: var(--body-base-font-size); line-height: var(--body-base-line-height);">
      <i data-lucide="clock" class="w-4 h-4" style="color: var(--icon-tertiary);"></i>
      <span>历史记录</span>
    </div>
    <div data-nav-key="settings" data-active="false" class="flex items-center gap-2.5 px-3 h-8 text-sm cursor-pointer" style="background: transparent; color: var(--text-secondary); border-radius: var(--radius-8); font-size: var(--body-base-font-size); line-height: var(--body-base-line-height);">
      <i data-lucide="settings" class="w-4 h-4" style="color: var(--icon-tertiary);"></i>
      <span>设置</span>
    </div>
  </nav>

  <!-- Bottom: API Key + Version -->
  <div class="px-3 py-4" style="border-top: 1px solid var(--border-neutral-l1);">
    <button class="ds-btn ds-btn--secondary ds-btn--md w-full justify-start">
      <i data-lucide="key-round" class="w-4 h-4"></i>
      <span>API 密钥</span>
    </button>
    <div class="mt-3 px-3" style="color: var(--text-tertiary); font-size: var(--body-sm-font-size); line-height: var(--body-sm-line-height);">v1.0.0</div>
  </div>
</aside>
<!-- ===== End Project Shell ===== -->
