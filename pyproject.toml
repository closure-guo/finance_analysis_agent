[project]
name = "finance-agent"
version = "0.1.0"
description = "AI-powered financial analysis report system for A-share stocks"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "langgraph>=0.4.0",
    "pandas>=2.0.0",
    "litellm>=1.0.0",
    "akshare>=1.18.63",
    "pyarrow>=24.0.0",
    "python-docx>=1.1.0",
    "python-pptx>=1.0.0",
    "matplotlib>=3.8.0",
    "ddgs>=7.0",
    "pandas-stubs~=3.0.3",
    "fastmcp>=3.4.2",
    "langfuse>=2.0.0",
    "tavily-python>=0.7.26",
    "python-dotenv>=1.2.2",
]

[project.scripts]
finance-agent-mcp = "finance_agent.mcp_server:main"

[tool.uv]
package = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # Pyflakes
    "I",   # isort (import sorting)
    "W",   # pycodestyle warnings
    "N",   # pep8-naming
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "SIM", # flake8-simplify
    "S",   # flake8-bandit (security)
]
ignore = ["E501"]  # line-too-long (handled by formatter)

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101"]  # pytest uses assert

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
warn_return_any = true
warn_unused_ignores = true
check_untyped_defs = true

[dependency-groups]
dev = [
    "playwright>=1.60.0",
    "pre-commit>=4.0.0",
    "pytest>=9.0.3",
    "ruff>=0.15.15",
    "mypy>=2.1.0",
    "pytest-cov>=7.1.0",
]
