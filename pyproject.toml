[project]
name = "finance-agent"
version = "0.1.0"
description = "AI-powered financial analysis report system for A-share stocks"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "langgraph>=0.4.0",
    "gradio>=5.0.0",
    "pandas>=2.0.0",
    "litellm>=1.0.0",
    "akshare>=1.18.63",
    "pyarrow>=24.0.0",
    "python-docx>=1.1.0",
    "python-pptx>=1.0.0",
]

[tool.uv]
package = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # Pyflakes
    "I",   # isort (import sorting)
    "W",   # pycodestyle warnings
    "N",   # pep8-naming
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "SIM", # flake8-simplify
]
ignore = ["E501"]  # line-too-long (handled by formatter)

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
ignore_missing_imports = true
mypy_path = "src"
# 第三方库缺少类型 stubs，不报错
follow_imports = "skip"
# 允许隐式 Optional（与当前代码风格兼容）
implicit_optional = true
# 允许未标注的复杂变量（逐步推进）
warn_no_return = false

[dependency-groups]
dev = [
    "mypy>=2.1.0",
    "playwright>=1.60.0",
    "pytest>=9.0.3",
    "ruff>=0.15.15",
]
